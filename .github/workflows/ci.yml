name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"

      - name: Install dependencies
        # Зависимостям не нужны postinstall-скрипты; флаг убирает этот вектор.
        run: npm ci --ignore-scripts

      - name: Audit dependencies (production)
        run: npm audit --audit-level=high --omit=dev

      - name: Check probe modules load
        run: node -e "const p = require('./src/probes/ports'); const t = require('./src/probes/tls'); const h = require('./src/probes/http-headers'); if (!p.checkPort || !t.checkSSL || !h.checkHeaders) { process.exit(1); } console.log('probes OK');"

      - name: Check server modules parse
        run: |
          node --check src/server.js
          node --check src/core/config.js
          node --check src/core/server.js

      # node --check читает .js как CommonJS и падает на import. Разбираем
      # модули через vm, чтобы синтаксическая ошибка во фронтенде ловилась
      # в CI, а не глазами в браузере. Обход рекурсивный: ui/ и api/ —
      # подкаталоги.
      - name: Check frontend modules parse
        run: |
          node --experimental-vm-modules -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const vm = require("node:vm");
            const root = "public/assets/js";
            const walk = (dir) => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  walk(full);
                  continue;
                }
                if (!entry.name.endsWith(".js")) continue;
                const source = fs.readFileSync(full, "utf8");
                new vm.SourceTextModule(source, { identifier: full });
                console.log("ok", full);
              }
            };
            walk(root);
          '

      - name: Run tests
        run: npm test

      - name: Start server and healthcheck
        env:
          PUBLIC_ORIGIN: http://localhost:3000
        run: |
          node src/server.js &
          SERVER_PID=$!
          sleep 3
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ | grep 200
          kill $SERVER_PID
