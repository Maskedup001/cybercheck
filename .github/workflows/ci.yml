name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Check checks.js loads
        run: node -e "const c = require('./src/checks'); if (!c.checkPort || !c.checkSSL || !c.checkHeaders) { process.exit(1); } console.log('checks.js OK');"

      - name: Check server.js syntax
        run: node --check src/server.js

      - name: Start server and healthcheck
        env:
          PUBLIC_ORIGIN: https://localhost:3000
        run: |
          node src/server.js &
          SERVER_PID=$!
          sleep 3
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ | grep 200
          kill $SERVER_PID