name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"

      - name: Install dependencies
        # Зависимостям не нужны postinstall-скрипты; флаг убирает этот вектор.
        run: npm ci --ignore-scripts

      - name: Audit dependencies (production)
        run: npm audit --audit-level=high --omit=dev

      - name: Check checks.js loads
        run: node -e "const c = require('./src/checks'); if (!c.checkPort || !c.checkSSL || !c.checkHeaders) { process.exit(1); } console.log('checks.js OK');"

      - name: Check server.js syntax
        run: node --check src/server.js

      # node --check читает .js как CommonJS и падает на import. Разбираем
      # модули через vm, чтобы синтаксическая ошибка во фронтенде ловилась
      # в CI, а не глазами в браузере.
      - name: Check frontend modules parse
        run: |
          node --experimental-vm-modules -e '
            const fs = require("node:fs");
            const vm = require("node:vm");
            const dir = "public/assets/js";
            for (const name of fs.readdirSync(dir)) {
              if (!name.endsWith(".js")) continue;
              const source = fs.readFileSync(`${dir}/${name}`, "utf8");
              new vm.SourceTextModule(source, { identifier: name });
              console.log("ok", name);
            }
          '

      - name: Run tests
        run: npm test

      - name: Start server and healthcheck
        env:
          PUBLIC_ORIGIN: http://localhost:3000
        run: |
          node src/server.js &
          SERVER_PID=$!
          sleep 3
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ | grep 200
          kill $SERVER_PID
