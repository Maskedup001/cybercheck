services:
  - type: web
    name: cybercheck
    runtime: node
    plan: starter
    buildCommand: npm ci --ignore-scripts
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      # HMAC-секрет для токенов согласия: без него сервер с NODE_ENV=production
      # завершается с кодом 1. Render генерирует значение при создании сервиса.
      - key: CONSENT_SECRET
        generateValue: true
