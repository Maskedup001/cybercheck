<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<meta name="theme-color" content="#0f172a">
	<meta name="description" content="CyberCheck — экспресс-проверка безопасности сайта: порты, SSL, security-заголовки.">
	<title>CyberCheck — Проверка безопасности сайта</title>
	<meta property="og:title" content="CyberCheck — экспресс-проверка безопасности сайта">
	<meta property="og:description" content="Открытые порты, SSL, HTTP-заголовки и Risk Score A–F за один скан.">
	<meta property="og:type" content="website">
	<meta property="og:image"
		content="https://github.com/Maskedup001/cybercheck/raw/main/public/assets/screenshots/og-cover.png">
	<meta property="og:url" content="https://github.com/Maskedup001/cybercheck">
	<link rel="canonical" href="https://github.com/Maskedup001/cybercheck">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta name="twitter:card" content="summary_large_image">
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="/assets/css/main.css">
</head>

<body>
	<a href="#main-content" class="skip-link">Перейти к содержимому</a>
	<main class="container" id="main-content">
		<header class="site-header">
			<h1 class="site-header__title">CyberCheck</h1>
			<p class="site-header__subtitle">Экспресс-проверка безопасности сайта</p>
		</header>

		<form class="scan-form" data-js="scan-form" novalidate>
			<div class="scan-form__row">
				<div class="scan-form__field">
					<label class="u-visually-hidden" for="url">Адрес сайта</label>
					<input class="scan-form__input" id="url" name="url" data-js="url" type="text" placeholder="example.com"
						autocomplete="url" inputmode="url" autocapitalize="none" spellcheck="false" aria-describedby="form-error">
				</div>
				<button class="button button--primary scan-form__submit" type="submit" data-js="scan-submit">Проверить</button>
			</div>
			<p class="scan-form__error" data-js="form-error" id="form-error" role="alert" hidden></p>
		</form>

		<label class="consent">
			<input class="consent__control" type="checkbox" id="consent" data-js="consent">
			<span class="consent__text">Я подтверждаю, что являюсь владельцем сайта или имею разрешение на проверку</span>
		</label>

		<p class="u-visually-hidden" role="status" data-js="status"></p>

		<!-- БЛОК РЕЗУЛЬТАТА (скрыт по умолчанию) -->
		<section class="result" data-js="result" aria-label="Результаты проверки" hidden>
			<header class="result__header">
				<p class="result__brand">CyberCheck</p>
				<h2 class="result__title">Отчёт о проверке</h2>
				<dl class="result__meta">
					<div class="result__meta-item">
						<dt class="result__meta-label">Сайт:</dt>
						<dd class="result__meta-value" data-js="report-host"></dd>
					</div>
					<div class="result__meta-item">
						<dt class="result__meta-label">Дата:</dt>
						<dd class="result__meta-value" data-js="report-date"></dd>
					</div>
				</dl>
			</header>

			<div class="result__body" data-js="result-body"></div>

			<div class="result__actions">
				<button class="button button--secondary" type="button" data-js="print">Скачать PDF</button>
			</div>

			<!-- ВОТ ТОТ САМЫЙ ФУТЕР ОТЧЕТА -->
			<footer class="report-footer">
				<p class="report-footer__text">Отчёт сформирован автоматически и не заменяет полноценный аудит. Проверка
					выполнена с согласия владельца.</p>
				<p class="report-footer__meta">
					CyberCheck · <span data-js="report-date-footer"></span>
				</p>
			</footer>
		</section>

		<!-- ГЛОБАЛЬНЫЙ ФУТЕР СТРАНИЦЫ -->
		<footer class="page-footer">
			<a href="/legal.html" target="_blank" rel="noopener">Соглашение</a>
			<span class="page-footer__divider">·</span>
			<a href="/privacy.html" target="_blank" rel="noopener">Конфиденциальность</a> <span
				class="page-footer__divider">·</span>
			<span>CyberCheck © 2026</span>
		</footer>
	</main>

	<script type="module" src="/assets/js/app.js"></script>
</body>

</html>
