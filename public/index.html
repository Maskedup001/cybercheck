<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CyberCheck — Проверка безопасности сайта</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<main class="container">
		<header>
			<h1>CyberCheck</h1>
			<p class="subtitle">Экспресс-проверка безопасности сайта</p>
		</header>

		<section class="scan-form">
			<input id="url" type="text" placeholder="example.com" autocomplete="off">
			<button id="scanBtn" onclick="scan()">Проверить</button>
		</section>

		<label class="consent">
			<input type="checkbox" id="consent">
			<span>Я подтверждаю, что являюсь владельцем сайта или имею разрешение на проверку</span>
		</label>

		<section id="result" class="result"></section>
	</main>

	<script src="script.js"></script>
</body>

</html>
